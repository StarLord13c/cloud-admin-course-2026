<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Cloud Site — Kusik</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #1a2980, #26d0ce);
      color: #fff;
    }
    .card {
      padding: 2.5rem 3rem;
      background: rgba(0, 0, 0, .35);
      border-radius: 12px;
      text-align: center;
      backdrop-filter: blur(6px);
    }
    h1 { margin: 0 0 .5rem; font-size: 2.4rem; }
    p  { margin: 0; opacity: .85; }
    .tag {
      display: inline-block;
      margin-top: 1rem;
      padding: 4px 10px;
      background: rgba(255,255,255,.15);
      border-radius: 4px;
      font-family: monospace;
      font-size: .85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Welcome to my Cloud Site</h1>
    <p>Розгорнуто через S3 Static Website Hosting</p>
    <p>Лабораторна робота №3 — Кусік І.А., 12-441</p>
    <span class="tag">s3://web-hosting-bucket</span>
  </div>
</body>
</html>
